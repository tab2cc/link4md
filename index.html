<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>URL Markdown Document</title>
<!-- Pin versions; add integrity="sha384-..." crossorigin="anonymous" from jsDelivr. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; color: #24292f; }
  #editor-container, #viewer-container { display: none; }
  textarea { width: 100%; height: 60vh; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .btn { background: #2da44e; color: #fff; border: 0; padding: 10px 20px; font-size: 16px;
         border-radius: 6px; cursor: pointer; margin-top: 10px; }
  .btn-secondary { background: #6e7781; }
  .toolbar { margin-bottom: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 13px; color: #9a6700; margin-top: 6px; min-height: 1em; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
             overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
           background: #24292f; color: #fff; padding: 10px 16px; border-radius: 6px;
           opacity: 0; pointer-events: none; transition: .2s; z-index: 10; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- limits dialog ---- */
  dialog#limits-dialog { border: 1px solid #d0d7de; border-radius: 8px; padding: 0;
                         width: min(640px, calc(100% - 2rem)); max-height: 85vh; color: inherit; }
  dialog#limits-dialog::backdrop { background: rgba(0, 0, 0, .4); }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px;
                 padding: 12px 16px; border-bottom: 1px solid #d0d7de; position: sticky; top: 0;
                 background: #fff; }
  .dialog-head h2 { font-size: 17px; margin: 0; }
  .dialog-body { padding: 16px; overflow: auto; max-height: calc(85vh - 56px); }
  .dialog-body .btn { margin-top: 0; }
  #limits-summary { margin: 0 0 2px; font-variant-numeric: tabular-nums; }
  #limits-verdict { margin: 0 0 12px; font-size: 14px; }
  #limits-url { display: block; margin: 0 0 16px; padding: 8px 10px; background: #f6f8fa;
                border: 1px solid #eaeef2; border-radius: 6px; font-family: ui-monospace, Menlo, monospace;
                font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 8em;
                overflow: auto; }
  table.limits { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.limits caption { text-align: left; font-size: 13px; color: #57606a; padding-bottom: 6px; }
  table.limits th, table.limits td { text-align: left; padding: 6px 8px;
                                     border-bottom: 1px solid #eaeef2; vertical-align: top; }
  table.limits th { font-weight: 600; }
  table.limits td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.limits td.ok { color: #1a7f37; white-space: nowrap; }
  table.limits td.no { color: #cf222e; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<noscript><p>This document viewer requires JavaScript.</p></noscript>

<div id="viewer-container">
  <div class="toolbar">
    <button class="btn btn-secondary" id="edit-btn">✏️ Edit Document</button>
    <button class="btn btn-secondary" id="copy-md-btn">📋 Copy Markdown</button>
    <button class="btn btn-secondary" id="limits-btn-view">📏 Check link length</button>
  </div>
  <div id="render-target"></div>
</div>

<div id="editor-container">
  <div class="toolbar"><strong>Serverless Markdown Editor</strong></div>
  <label for="markdown-input" class="sr-only">Markdown source</label>
  <textarea id="markdown-input" placeholder="# Type your Markdown here..."></textarea>
  <div class="hint" id="length-hint"></div>
  <div class="toolbar">
    <button class="btn" id="generate-btn">🔗 Copy Document Link</button>
    <button class="btn btn-secondary" id="limits-btn">📏 Check link length</button>
  </div>
</div>

<dialog id="limits-dialog" aria-labelledby="limits-title">
  <div class="dialog-head">
    <h2 id="limits-title">Link length check</h2>
    <button class="btn btn-secondary" id="limits-close" type="button">Close</button>
  </div>
  <div class="dialog-body">
    <p id="limits-summary"></p>
    <p id="limits-verdict"></p>
    <code id="limits-url"></code>
    <table class="limits">
      <caption>Typical published limits. Wrapped links (X, Mastodon, Bluesky) are shortened
        in the post, so their length doesn't matter there.</caption>
      <thead>
        <tr>
          <th scope="col">Where</th>
          <th scope="col">Limit</th>
          <th scope="col">Fits?</th>
        </tr>
      </thead>
      <tbody id="limits-rows"></tbody>
    </table>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  const PREFIX = '#/txt=';
  const SAFE_URL_LEN = 8000;
  const libsReady = typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined';
  const encoder = new TextEncoder();

  const $ = (id) => document.getElementById(id);
  const input = $('markdown-input');
  const renderTarget = $('render-target');
  const viewer = $('viewer-container');
  const editor = $('editor-container');
  const hint = $('length-hint');
  const dialog = $('limits-dialog');

  /* ------------------------------------------------------------------ *
   * Limits table. kind:
   *   'plain'     – compare measured length to `limit` in `unit`
   *   'wrap'      – service rewrites the link to `wrapped` chars; compare to post budget
   *   'unlimited' – no published URL limit
   * ------------------------------------------------------------------ */
  const LIMITS = [
    { where: 'a text message',        kind: 'plain', unit: 'characters', limit: 160 },
    { where: 'a small NFC sticker',   kind: 'plain', unit: 'bytes',      limit: 504 },
    { where: 'an NFC sticker',        kind: 'plain', unit: 'bytes',      limit: 888 },
    { where: 'a Discord message',     kind: 'plain', unit: 'characters', limit: 2000 },
    { where: 'older browsers',        kind: 'plain', unit: 'characters', limit: 2048 },
    { where: 'a QR code',             kind: 'plain', unit: 'bytes',      limit: 2953 },
    { where: 'a link in Google Docs', kind: 'plain', unit: 'characters', limit: 4096 },
    { where: 'a Telegram message',    kind: 'plain', unit: 'characters', limit: 4096 },
    { where: 'X',                     kind: 'wrap',  unit: 'characters', limit: 4096,
      wrapped: 23, budget: 280 },
    { where: 'a short link',          kind: 'plain', unit: 'bytes',      limit: 12272 },
    { where: 'Mastodon',              kind: 'wrap',  limit: null,
      wrapped: 23, budget: 500 },
    { where: 'Bluesky',               kind: 'wrap',  limit: null,
      wrapped: 30, budget: 300 },
    { where: 'Firefox',               kind: 'plain', unit: 'characters', limit: 1048576 },
    { where: 'Chrome and Edge',       kind: 'plain', unit: 'characters', limit: 2097152 },
    { where: 'Safari',                kind: 'unlimited', limit: null }
  ];

  /* ---------------------------- toast ------------------------------- */
  let toastTimer;
  function toast(msg, ms = 2200) {
    let el = $('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  }

  /* ------------------------ URL plumbing ---------------------------- */
  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (_) { return s; }
  }

  // Hash wins over the query string, so a freshly generated hash link is
  // never shadowed by a stale ?txt= parameter.
  function readPayload() {
    const h = location.hash;
    if (h.startsWith(PREFIX)) {
      const text = safeDecode(h.slice(PREFIX.length));
      if (text) return { text, source: 'hash' };
    }
    const q = new URLSearchParams(location.search).get('txt'); // already decoded
    if (q) return { text: q, source: 'query' };
    return null;
  }

  function buildUrl(text) {
    const u = new URL(location.href);
    u.searchParams.delete('txt');          // don't let a stale query shadow the hash
    u.hash = PREFIX + encodeURIComponent(text);
    return u.href;
  }

  /* --------------------------- rendering ---------------------------- */
  function showViewer(text) {
    if (!libsReady) {
      switchToEdit();
      toast('Renderer failed to load — check your network/CDN.');
      return;
    }
    renderTarget.innerHTML = DOMPurify.sanitize(marked.parse(text));
    input.value = text;
    viewer.style.display = 'block';
    editor.style.display = 'none';
    const h = renderTarget.querySelector('h1, h2, h3');
    document.title = h ? h.textContent.trim() : 'URL Markdown Document';
    updateHint();
  }

  function switchToEdit() {
    viewer.style.display = 'none';
    editor.style.display = 'block';
    input.focus();
  }

  function init() {
    const payload = readPayload();
    if (!payload) { switchToEdit(); return; }
    try { showViewer(payload.text); }
    catch (err) { console.error('Render failed:', err); switchToEdit(); }
  }

  function updateHint() {
    const n = buildUrl(input.value).length;
    hint.textContent = n > SAFE_URL_LEN
      ? `Link is ${n.toLocaleString()} characters — most chat apps, proxies and servers will truncate or reject this URL.`
      : '';
  }

  /* ------------------------- limits checker ------------------------- */
  function evaluate(spec, chars, bytes) {
    if (spec.kind === 'unlimited') return { fits: true, detail: 'Yes' };

    if (spec.kind === 'wrap') {
      const fits = spec.wrapped <= spec.budget;
      return { fits, detail: `${fits ? 'Yes' : 'No'}, counts as ` +
        `${spec.wrapped.toLocaleString()} of ${spec.budget.toLocaleString()}` };
    }

    const used = spec.unit === 'bytes' ? bytes : chars;
    const fits = used <= spec.limit;
    const diff = Math.abs(spec.limit - used).toLocaleString();
    return { fits, detail: fits ? `Yes, ${diff} left` : `No, ${diff} over` };
  }

  function renderLimits(url) {
    const chars = [...url].length;                 // Unicode code points
    const bytes = encoder.encode(url).length;

    $('limits-summary').textContent =
      `This link: ${chars.toLocaleString()} characters, ${bytes.toLocaleString()} bytes`;
    $('limits-url').textContent = url;

    const tbody = $('limits-rows');
    tbody.textContent = '';
    const frag = document.createDocumentFragment();
    let failures = 0;

    for (const spec of LIMITS) {
      const res = evaluate(spec, chars, bytes);
      if (!res.fits) failures++;

      const tr = document.createElement('tr');

      const where = document.createElement('td');
      where.textContent = spec.where;

      const limit = document.createElement('td');
      limit.className = 'num';
      limit.textContent = spec.limit == null
        ? 'None published'
        : `${spec.limit.toLocaleString()} ${spec.unit}`;

      const fits = document.createElement('td');
      fits.className = res.fits ? 'ok' : 'no';
      fits.textContent = `${res.fits ? '✓' : '✗'} ${res.detail}`;

      tr.append(where, limit, fits);
      frag.append(tr);
    }
    tbody.append(frag);

    const verdict = $('limits-verdict');
    verdict.textContent = failures
      ? `${failures} of ${LIMITS.length} limits exceeded.`
      : `Fits every limit listed.`;
    verdict.className = failures ? 'no' : 'ok';
    verdict.style.color = failures ? '#cf222e' : '#1a7f37';
    verdict.style.fontWeight = failures ? '600' : '400';
  }

  function openLimits() {
    renderLimits(buildUrl(input.value));
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');         // very old browsers: inline fallback
  }

  /* --------------------------- actions ------------------------------ */
  async function generateLink() {
    const text = input.value;
    if (!text.trim()) { toast('Write some Markdown first.'); return; }
    if (!libsReady)   { toast('Renderer failed to load — cannot verify the document.'); return; }

    const url = buildUrl(text);
    if (url.length > SAFE_URL_LEN &&
        !confirm(`This link is ${url.length.toLocaleString()} characters long.\n\n` +
                 `Many chat apps, link shorteners and proxies truncate URLs this long. Copy anyway?`)) {
      return;
    }

    // Update the address bar without spamming history; fall back on file://.
    let replaced = false;
    try { history.replaceState(null, '', url); replaced = true; } catch (_) {}
    if (!replaced) location.hash = new URL(url).hash;

    showViewer(text);                             // replaceState fires no event

    try {
      if (!navigator.clipboard) throw new Error('Clipboard API unavailable');
      await navigator.clipboard.writeText(url);
      toast('Link copied to clipboard.');
    } catch (_) {
      window.prompt('Copy this link:', url);
    }
  }

  /* --------------------------- wiring ------------------------------- */
  $('generate-btn').addEventListener('click', generateLink);
  $('edit-btn').addEventListener('click', switchToEdit);
  $('limits-btn').addEventListener('click', openLimits);
  $('limits-btn-view').addEventListener('click', openLimits);
  $('limits-close').addEventListener('click', () => dialog.close());

  // Click on the backdrop (which targets the <dialog> itself) closes.
  dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });

  $('copy-md-btn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(input.value);
      toast('Markdown copied.');
    } catch (_) {
      window.prompt('Copy the Markdown:', input.value);
    }
  });

  input.addEventListener('input', updateHint);
  window.addEventListener('hashchange', init);
  init();
})();
</script>
</body>
</html>
