name: Deploy md2c to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers the workflow whenever you push to main
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

# Set safe permissions required for GitHub Pages deployments
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from clashing
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages Environment
        uses: actions/configure-pages@v5

      # Prepares the workspace by copying index.html to the deployment folder
      - name: Prepare Static Files
        run: |
          mkdir _site
          cp index.html _site/index.html

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
